<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iightshot - Công cụ chia sẻ ảnh nhanh</title>
    <style>
        /* --- CSS: Giao diện (Màu tối, giống iightshot) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #drop-zone {
            width: 80%;
            max-width: 600px;
            height: 300px;
            border: 2px dashed #444;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
        }

        #drop-zone.hover {
            border-color: #3498db;
            background-color: #222;
        }

        #drop-zone p {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            color: #aaa;
        }

        #drop-zone .icon {
            font-size: 4rem;
            margin-bottom: 10px;
            color: #555;
        }

        /* Nút chọn ảnh */
        .browse-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .browse-btn:hover {
            background-color: #2980b9;
        }

        /* Vùng hiển thị ảnh sau khi chọn */
        #preview-container {
            display: none; /* Ẩn lúc đầu */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #preview-image {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #close-preview {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            user-select: none;
        }
        
        #url-display {
            position: absolute;
            bottom: 30px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- --- HTML: Cấu trúc trang --- -->
    <div id="drop-zone">
        <div class="icon">📷</div>
        <p>Kéo & Thả ảnh vào đây</p>
        <p>hoặc</p>
        <button class="browse-btn" onclick="document.getElementById('file-input').click()">Chọn ảnh</button>
        <input type="file" id="file-input" accept="image/*" style="display: none;">
    </div>

    <!-- Vùng xem trước ảnh (giống trang iightshot) -->
    <div id="preview-container">
        <span id="close-preview">&times;</span>
        <img id="preview-image" src="" alt="Xem trước ảnh">
        <div id="url-display">Ảnh đã được nhận!</div>
    </div>

    <!-- --- JavaScript: Xử lý logic --- -->
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const closePreview = document.getElementById('close-preview');

        // 1. Ngăn chặn hành vi mặc định của trình duyệt (để kéo thả hoạt động)
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 2. Hiệu ứng khi kéo file vào vùng drop
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('hover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('hover');
        }

        // 3. Xử lý khi thả file (Drop)
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            handleFiles(files);
        }

        // 4. Xử lý khi chọn file qua nút "Chọn ảnh"
        fileInput.addEventListener('change', function() {
            handleFiles(this.files);
        });

        // 5. Hàm xử lý file chính (Đọc và Hiển thị)
        function handleFiles(files) {
            if (files.length > 0) {
                let file = files[0];

                // Kiểm tra xem có phải là ảnh không
                if (!file.type.startsWith('image/')) {
                    alert('Vui lòng chỉ chọn file ảnh!');
                    return;
                }

                // Đọc file ảnh bằng FileReader
                let reader = new FileReader();
                reader.readAsDataURL(file); // Đọc file dưới dạng URL

                reader.onloadend = function() {
                    // Đọc xong: Gán link ảnh vào thẻ img và hiển thị vùng xem trước
                    previewImage.src = reader.result;
                    previewContainer.style.display = 'flex';
                }
            }
        }

        // 6. Đóng vùng xem trước (giống trang iightshot khi click vào ảnh hoặc dấu X)
        closePreview.addEventListener('click', () => {
            previewContainer.style.display = 'none';
        });

        previewContainer.addEventListener('click', (e) => {
            // Chỉ đóng khi click vào vùng nền hoặc ảnh, không phải các nút khác
            if (e.target === previewContainer || e.target === previewImage) {
                previewContainer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
